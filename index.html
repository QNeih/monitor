<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dae6e4">
<title>Monitor</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<script>try{if(JSON.parse(localStorage.getItem("dark")))document.documentElement.classList.add("dark")}catch{}</script>
</head>
<body>
<header>
  <nav id="tabs"></nav>
  <button id="edit" class="icon" aria-label="Einstellungen">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</header>
<main id="stage">
  <p id="empty" hidden>Noch keine Haltestelle. Tippe auf das Zahnrad.</p>
  <iframe id="board" title="Abfahrten"></iframe>
</main>

<dialog id="editor">
  <form method="dialog" class="sheet">
    <div class="sheet-head">
      <h2>Einstellungen</h2>
      <button value="close" class="icon" aria-label="Schließen">✕</button>
    </div>
    <label class="switch">Dunkles Design <input id="dark" type="checkbox" role="switch"></label>
    <h3>Haltestellen</h3>
    <ul id="list"></ul>
    <h3>Hinzufügen</h3>
    <label>Name <input id="f-name" placeholder="z. B. Neumarkt" autocomplete="off"></label>
    <label>Richtung <input id="f-note" placeholder="z. B. 9 → Sülz" autocomplete="off"></label>
    <label>VRS-Monitor-Link <input id="f-url" placeholder="https://www.vrs.de/am/s/…" inputmode="url" autocomplete="off"></label>
    <p class="hint">Linie und Richtung wählst du beim VRS: <a href="https://www.vrs.de/fahrplanauskunft/abfahrtsmonitor" target="_blank" rel="noopener">Monitor erstellen</a> → Layout „1 Haltestelle“ → Haltestelle, „Linien und Richtung“, Anzahl → Anzeige-Link hier einfügen. Ohne Link: ungefilterte KVB-Tafel.</p>
    <p id="f-err" class="err" hidden></p>
    <button id="f-add" type="button" class="primary">Hinzufügen</button>
  </form>
</dialog>
<script src="app.js" type="module"></script>
</body>
</html>
