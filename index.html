<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dae6e4">
<title>Monitor</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <nav id="tabs"></nav>
  <button id="edit" class="icon" aria-label="Haltestellen bearbeiten">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg>
  </button>
</header>
<main id="stage">
  <p id="empty" hidden>Noch keine Haltestelle. Tippe auf den Stift.</p>
  <iframe id="board" title="Abfahrten"></iframe>
</main>

<dialog id="editor">
  <form method="dialog" class="sheet">
    <div class="sheet-head">
      <h2>Haltestellen</h2>
      <button value="close" class="icon" aria-label="Schließen">✕</button>
    </div>
    <ul id="list"></ul>
    <h3>Hinzufügen</h3>
    <label>Name <input id="f-name" placeholder="z. B. Neumarkt" autocomplete="off"></label>
    <label>Richtung <input id="f-note" placeholder="z. B. 9 → Sülz" autocomplete="off"></label>
    <label>VRS-Monitor-Link <input id="f-url" placeholder="https://www.vrs.de/am/s/…" inputmode="url" autocomplete="off"></label>
    <p class="hint">Linie und Richtung wählst du beim VRS: <a href="https://www.vrs.de/fahrplanauskunft/abfahrtsmonitor" target="_blank" rel="noopener">Monitor erstellen</a> → Layout „1 Haltestelle“ → Haltestelle, „Linien und Richtung“, Anzahl → Anzeige-Link hier einfügen. Ohne Link: ungefilterte KVB-Tafel.</p>
    <p id="f-err" class="err" hidden></p>
    <button id="f-add" type="button" class="primary">Hinzufügen</button>
  </form>
</dialog>
<script src="app.js" type="module"></script>
</body>
</html>
